<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>Pocket Deck — スマホ接続</title><link rel="stylesheet" href="/style.css"><script defer src="/common.js"></script><script defer src="/connect.js"></script></head><body><main class="shell"><header class="topbar"><h1>スマホ接続</h1><button id="menuOpen" aria-label="メニューを開く">メニュー</button></header><section class="connect-content"><div id="qrView" class="qr-view"><p>同じWi-Fiで、カメラから読み取り</p><div class="qr-frame"><img id="connectQr" alt="スマホ接続用QRコード" width="280" height="280" hidden></div></div><div id="urlView" class="field-content" hidden><h2>接続先URL</h2><a id="connectUrl">確認中…</a></div></section><div class="toolbar"><button id="showQr">QR</button><button id="showUrl">URL</button><button id="connectHelp">接続案内</button></div><div class="statusbar"><span id="status">接続中…</span><button id="message" aria-label="通知の詳細を表示" disabled>準備中</button></div></main><dialog id="menuDialog" class="sheet"><div class="sheet-head"><h2>メニュー</h2><button id="menuClose">閉じる</button></div><nav class="menu-links"><a class="button" data-navigation href="/">操作画面</a><a class="button" data-navigation href="/editor">配置を編集</a><a class="button" data-navigation href="/connect">スマホ接続 QR</a></nav></dialog>
<dialog id="noticeDialog" class="sheet"><div class="sheet-head"><h2 id="noticeTitle">お知らせ</h2><span id="noticePage"></span></div><p id="noticeText" class="notice-text"></p><div class="toolbar"><button id="noticePrev">前へ</button><button id="noticeNext">次へ</button><button id="noticeCancel">戻る</button><button id="noticeAccept" class="primary">閉じる</button></div></dialog></body></html>
