<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>Pocket Deck — 操作</title><link rel="stylesheet" href="/style.css"><script defer src="/common.js"></script><script defer src="/layout.js"></script><script defer src="/extras.js"></script><script defer src="/pad.js"></script><script defer src="/operator.js"></script></head><body class="operator"><main class="shell"><header class="control-bar"><button id="menuOpen" aria-label="メニューを開く">☰</button><button id="deckMode" aria-label="登録ボタンを表示" aria-pressed="true">配置</button><button id="keyboardMode" aria-label="キーボードを表示" aria-pressed="false">キー配列</button><button id="padMode" aria-label="タッチパッドを表示" aria-pressed="false">パッド</button><span id="status" role="status">○</span><button id="message" aria-label="通知の詳細を表示" disabled></button><button id="release">全キー解除</button></header><div id="deck" class="deck"></div><section id="keyboardPanel" class="screen-keyboard" aria-label="PCキーボード" hidden></section><section id="padPanel" class="touchpad-panel" hidden><div id="touchpad" tabindex="0" role="button" aria-label="タッチパッド。1本指で移動、タップでクリック、2本指でスクロール、ダブルタップ保持でドラッグ"><span>指を動かしてカーソル移動<br>タップで左クリック</span></div><div class="pad-actions"><span>PCの画面を見ながら操作</span><button id="padClick">左クリック</button></div></section></main><dialog id="menuDialog" class="sheet"><div class="sheet-head"><h2>メニュー</h2><button id="menuClose">閉じる</button></div><nav class="menu-links"><a class="button" data-navigation href="/">操作画面</a><a class="button" data-navigation href="/editor">配置を編集</a><a class="button" data-navigation href="/connect">スマホ接続 QR</a></nav></dialog>
<dialog id="noticeDialog" class="sheet"><div class="sheet-head"><h2 id="noticeTitle">お知らせ</h2><span id="noticePage"></span></div><p id="noticeText" class="notice-text"></p><div class="toolbar"><button id="noticePrev">前へ</button><button id="noticeNext">次へ</button><button id="noticeCancel">戻る</button><button id="noticeAccept" class="primary">閉じる</button></div></dialog></body></html>
