<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101923"><title>Pocket Deck — 編集</title><link rel="stylesheet" href="/style.css"><script defer src="/common.js"></script><script defer src="/layout.js"></script><script defer src="/extras.js"></script><script defer src="/autosave.js"></script><script defer src="/reorder.js"></script><script defer src="/key-picker.js"></script><script defer src="/editor.js"></script><script defer src="/editor-extras.js"></script></head><body class="editor"><main class="shell"><header class="topbar"><h1>配置を編集</h1><button id="saveState" type="button" title="保存状態・再試行">読み込み中</button><button id="menuOpen" aria-label="メニューを開く">☰</button></header>
<section id="layoutView" class="workview"><div id="deck" class="deck"></div><div id="moveTools" class="toolbar" hidden><button data-axis="single">個別</button><button data-axis="multi">複数選択</button></div><span id="moveHint" role="status" hidden></span><div id="lineTools" hidden><p id="lineHint" role="status"></p><div id="lineSides" class="toolbar"><button id="lineBefore"></button><button id="lineAfter"></button></div><div id="lineEffects"></div><div class="toolbar"><button id="lineCancel">キャンセル</button><button id="lineReview">結果を見る</button><button id="lineReselect" hidden>位置を選び直す</button><button id="lineApply" hidden></button></div></div><div id="layoutActions" class="toolbar"><button id="add">＋追加</button><button id="move">移動</button><button id="pageSettings">行・列</button><button id="layouts">配置管理</button></div><button id="undoLayout" type="button" hidden>配置を元に戻す</button><span id="density"></span></section>
<section id="pageView" class="workview" hidden><div class="field-content"><h2>行・列</h2><div class="line-actions"><button type="button" data-line="row:add">行を追加</button><button type="button" data-line="row:delete">行を削除</button><button type="button" data-line="column:add">列を追加</button><button type="button" data-line="column:delete">列を削除</button></div><label for="columns">列数（1〜12）</label><input id="columns" type="number" min="1" max="12" inputmode="numeric"><label for="rows">行数（1〜200）</label><input id="rows" type="number" min="1" max="200" inputmode="numeric"><p id="gridError" role="status"></p></div><div class="toolbar"><button id="pageBack">戻る</button></div></section>
<form id="form" class="workview" hidden novalidate><div class="field-content overview">
<section class="wide"><label for="label">名前</label><input id="label" maxlength="60" autocomplete="off"></section>
<section><label for="type">入力種類</label><select id="type"><option value="shortcut">ショートカット</option><option value="text">文字列</option><option value="macro">連続操作</option><option value="profile">Chromeプロフィール</option><option value="wheel">マウスホイール</option><option value="touchpad">タッチパッド（配置内）</option><option value="navigate">画面切り替え</option></select></section>
<section><label for="color">色</label><input id="color" type="color"></section>
<section id="shortcutField" class="wide"><label for="keysSummary">キー</label><input id="keys" type="hidden"><button id="keysSummary" type="button" aria-haspopup="dialog">キーを選択 ▾</button></section>
<section id="targetField" class="wide" hidden><label for="target">移動先</label><select id="target"><option value="keyboard">キー配列を開く</option><option value="pad">パッドを開く</option><option value="layout">別の配置</option></select></section><section><label for="width">横幅（列分）</label><select id="width"></select></section><section><label for="height">高さ（行分）</label><select id="height"></select></section><section id="textField" class="wide" hidden><label for="text">入力する文字列（1,000文字まで）</label><textarea id="text" maxlength="2000" rows="3" spellcheck="false"></textarea><label for="pasteMode">貼り付け先</label><select id="pasteMode"><option value="standard">通常の入力欄</option><option value="terminal">Linuxの端末（Ctrl＋Shift＋V）</option></select></section>
<section id="layoutTargetField" class="wide" hidden><label for="layoutTarget">移動先の配置</label><select id="layoutTarget"></select></section>
<section id="wheelField" class="wide" hidden><label for="invertY">ホイールの上下方向</label><select id="invertY"><option value="false">標準</option><option value="true">逆向き</option></select></section>
<section id="profileField" class="wide" hidden><label for="profileTarget">Chromeプロフィール</label><select id="profileTarget"></select><button type="button" id="refreshProfiles">一覧を更新</button><p class="small">各Chromeの連携拡張で名前を登録すると選べます。</p></section>
<section id="macroField" class="wide" hidden><label>連続操作</label><button type="button" id="macroOpen">手順を編集</button><p id="macroSummary" class="small"></p></section>
<section class="wide appearance-field"><label for="appearanceMode">見た目</label><select id="appearanceMode"><option value="label">名前のみ</option><option value="both">アイコン／画像＋名前</option><option value="visual">アイコン／画像のみ</option></select><div id="appearancePreview"></div><div class="inline-actions"><button type="button" id="chooseIcon">アイコン</button><label class="button image-upload">画像を選ぶ<input id="imageFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="clearVisual">解除</button></div><p class="small" id="imageState">PNG・JPEG・WebP / 5MBまで</p></section>
<p id="formError" class="wide" role="status"></p></div><div class="toolbar"><button type="button" id="cancel">戻る</button><button type="button" id="duplicate">複製</button><button type="button" id="delete">削除</button></div></form>
<div class="statusbar"><span id="status">○</span><button id="message" aria-label="通知の詳細を表示" disabled></button></div></main><dialog id="menuDialog" class="sheet"><div class="sheet-head"><h2>メニュー</h2><button id="menuClose">閉じる</button></div><nav class="menu-links"><a class="button" data-navigation href="/">操作画面</a><a class="button" data-navigation href="/editor">配置を編集</a><a class="button" data-navigation href="/connect">スマホ接続 QR</a></nav></dialog>
<dialog id="macroEditor" class="sheet macro-editor" aria-labelledby="macroTitle"><div class="sheet-head"><h2 id="macroTitle">連続操作</h2><span id="macroSaveState" role="status"></span><button type="button" id="macroSettings">ボタン設定</button></div><div class="macro-name"><label for="macroName">ボタン名</label><input id="macroName" maxlength="60" autocomplete="off"></div><div class="macro-workspace"><div id="steps" aria-label="手順一覧"></div><aside id="stepDetail" aria-label="選択した手順の編集"></aside></div><p id="macroError" role="status"></p><div class="macro-secondary"><button type="button" id="stepFrom">既存ボタンから</button><button type="button" id="stepTemplate">テンプレート</button></div><div class="toolbar"><button type="button" id="macroBack">配置へ戻る</button><button type="button" id="stepAdd" class="primary">＋ 手順</button></div></dialog>
<dialog id="noticeDialog" class="sheet"><div class="sheet-head"><h2 id="noticeTitle">お知らせ</h2><span id="noticePage"></span></div><p id="noticeText" class="notice-text"></p><div class="toolbar"><button id="noticePrev">前へ</button><button id="noticeNext">次へ</button><button id="noticeCancel">戻る</button><button id="noticeAccept" class="primary">閉じる</button></div></dialog><dialog id="keyPicker" class="sheet key-picker" aria-label="キーを検索して選択"><div class="key-selection"><span id="selectedKeys">未選択</span><button type="button" id="keyUndo" aria-label="最後のキーを外す">⌫</button><button type="button" id="keyClear">クリア</button></div><input id="keySearch" type="search" aria-label="キーを検索" placeholder="検索：Ctrl、A、矢印、音量…" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="keyOptions" aria-autocomplete="list"><div id="keyOptions" role="listbox" aria-label="キー候補" aria-multiselectable="true"></div><div id="keyCount" role="status"></div><div class="toolbar"><button id="keyCancel" type="button">戻る</button><button id="keyDone" type="button" class="primary">決定</button></div></dialog></body></html>
